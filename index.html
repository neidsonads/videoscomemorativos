<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uma surpresa para a Bianca 🎁</title>
<meta property="og:title" content="Uma surpresa para a Bianca 🎁">
<meta property="og:image" content="capa.jpg">
<meta name="theme-color" content="#1a0306">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#1a0306;overflow:hidden}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#1a0306}
  #abrir{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
    background:radial-gradient(ellipse at 50% 40%,rgba(122,16,34,.92),rgba(26,3,6,.97));color:#fff;text-align:center;
    cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .5s}
  #abrir.sai{opacity:0;pointer-events:none}
  .nome{font:400 clamp(64px,20vw,120px)/1 'Great Vibes',cursive;color:#ffe7a8;text-shadow:0 0 30px rgba(245,200,106,.5)}
  .presente{font-size:clamp(70px,22vw,110px);animation:pula 1.4s ease-in-out infinite}
  .botao{font:600 clamp(17px,5vw,22px)/1.3 'Poppins',sans-serif;background:#e9b65a;color:#3d0610;padding:16px 30px;border-radius:999px;
    box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .dica{font:600 14px 'Poppins',sans-serif;color:rgba(255,231,168,.7)}
  @keyframes pula{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
</style>
</head>
<body>
<video id="v" poster="capa.jpg" playsinline webkit-playsinline preload="auto"></video>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
  (function(){
    const v = document.getElementById('v'), src = 'bianca.m3u8';
    if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = src; }
    else if (window.Hls && Hls.isSupported()) { const h = new Hls({maxBufferLength: 60}); h.loadSource(src); h.attachMedia(v); }
    else { v.src = src; }
  })();
</script>
<div id="abrir">
  <div class="nome">Bianca</div>
  <div class="presente">🎁</div>
  <div class="botao">Toque para abrir sua surpresa</div>
  <div class="dica">aumenta o som 🔊</div>
</div>
<script>
  const v = document.getElementById('v'), a = document.getElementById('abrir');
  a.addEventListener('click', () => {
    v.muted = false; v.currentTime = 0; v.play().catch(() => {});
    a.classList.add('sai');
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el)?.catch?.(() => {});
  });
  v.addEventListener('click', () => { v.paused ? v.play() : v.pause(); });
  v.addEventListener('ended', () => { a.querySelector('.botao').textContent = 'Assistir de novo 💛'; a.classList.remove('sai'); });
</script>
</body>
</html>
